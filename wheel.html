<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1217">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>WDC — Phone Wheel</title>
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  :root { --ink: #eef0f2; --dim: #8b949c; --bg: #0f1217; --panel: #181c22; --mint: #35d6a0; --red: #e0483a; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: ui-sans-serif, "Inter", system-ui, sans-serif; overflow: hidden; }
  #app { height: 100%; display: flex; align-items: center; justify-content: center; padding: 14px; text-align: center; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 100; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: var(--bg); padding: 24px; }
  #rotate .icon { font-size: 60px; animation: spin 2.2s ease-in-out infinite; }
  @keyframes spin { 0%,60% { transform: rotate(0) } 80%,100% { transform: rotate(90deg) } }
  @media (orientation: portrait) { #rotate { display: flex; } #app { display: none; } }
  h1 { font-size: 28px; font-weight: 900; letter-spacing: 3px; }
  h1 span { color: var(--mint); }
  .dim { color: var(--dim); font-size: 14px; }
  .hidden { display: none !important; }
  #connect { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 360px; }
  input#code { font-size: 30px; font-weight: 800; letter-spacing: 8px; text-align: center; text-transform: uppercase; width: 100%;
    padding: 12px; border-radius: 12px; border: 2px solid #2a3038; background: var(--panel); color: #fff; outline: none; }
  input#code:focus { border-color: var(--mint); }
  button { font-family: inherit; font-size: 18px; font-weight: 800; color: #06140f; background: var(--mint); border: 0;
    border-radius: 12px; padding: 14px 22px; width: 100%; cursor: pointer; }
  button.sec { background: #252a31; color: var(--ink); font-size: 14px; padding: 10px 14px; width: auto; }
  button:active { transform: scale(.97); }
  #drive { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; height: 100%; gap: 14px; }
  #wheel { width: min(70vh, 330px); height: auto; transition: transform .04s linear; }
  #status { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font-size: 13px;
    font-weight: 700; padding: 6px 14px; border-radius: 20px; background: #252a31; white-space: nowrap; }
  #status.ok { background: #13352a; color: #7ee5bf; } #status.err { background: #3a1a1a; color: #f0a0a0; }
  .side { display: flex; flex-direction: column; gap: 10px; align-items: stretch; font-size: 13px; color: var(--dim); }
  .side label { display: flex; flex-direction: column; gap: 4px; text-align: left; }
  .side .row { display: flex; align-items: center; gap: 8px; }
  .bar { width: 100%; height: 10px; background: #252a31; border-radius: 5px; position: relative; overflow: hidden; }
  .bar i { position: absolute; top: 0; bottom: 0; left: 50%; width: 0; background: var(--mint); }
  #deg { font-size: 22px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="rotate"><div class="icon">📱</div><h1>Turn sideways</h1><p class="dim">Hold your phone like a steering wheel.</p></div>

<div id="app">
  <div id="connect">
    <h1>WDC <span>WHEEL</span></h1>
    <p class="dim">The code is on the game screen, under PHONE WHEEL.</p>
    <input id="code" maxlength="6" placeholder="CODE" autocomplete="off" autocapitalize="characters">
    <button id="go">CONNECT &amp; ENABLE MOTION</button>
    <p class="dim" id="err"></p>
  </div>

  <div id="drive" class="hidden">
    <div id="status">Connecting…</div>
    <div class="side">
      <div id="deg">STRAIGHT</div>
      <div class="bar"><i id="fill"></i></div>
      <button class="sec" id="centre">⟲ CENTRE HERE</button>
    </div>
    <svg id="wheel" viewBox="0 0 200 200" aria-label="steering wheel">
      <path d="M20 70 Q20 40 50 36 L150 36 Q180 40 180 70 L184 128 Q184 162 150 166 L50 166 Q16 162 16 128 Z" fill="#1c2026" stroke="#2c323b" stroke-width="4"/>
      <rect x="62" y="70" width="76" height="46" rx="8" fill="#0b0d10"/>
      <text x="100" y="99" text-anchor="middle" font-size="20" font-weight="800" fill="#35d6a0" font-family="ui-monospace, monospace">WDC</text>
      <rect x="92" y="36" width="16" height="10" rx="3" fill="#35d6a0"/>
      <circle cx="44" cy="92" r="9" fill="#e0483a"/><circle cx="156" cy="92" r="9" fill="#2f6fe0"/>
      <circle cx="44" cy="124" r="7" fill="#f0b429"/><circle cx="156" cy="124" r="7" fill="#eef0f2"/>
    </svg>
    <div class="side">
      <label>Sensitivity <span class="row"><input type="range" id="sens" min="12" max="70" value="28"><span id="sensV">28°</span></span></label>
      <label class="row"><input type="checkbox" id="invert"> Invert steering</label>
      <button class="sec" id="fs">⛶ Fullscreen</button>
      <button class="sec" id="off">Disconnect</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
// The phone half of js/phonewheel.js. Steering is the phone's ROLL in its own
// screen plane, measured against gravity: absolute, so it never drifts, and
// "centre" is simply however you are holding it when you connect (or press
// CENTRE HERE). Straight from Apex Racer's phone wheel, which has been driven.
const CFG = {
  url: 'https://wsjrcoibrigewmwospva.supabase.co',
  key: 'sb_publishable_n88dYo7wUYb_utwKiQT3uQ_HGOtXDZb',
  prefix: 'wdc:',
};
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const read = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } };

let sens = +read('wdc_wheel_sens', 28), invert = read('wdc_wheel_invert', '0') === '1';
let channel = null, zero = null, steer = 0, fx = 0, fy = -9.8, primed = false, lastSent = 0;
$('sens').value = sens; $('sensV').textContent = sens + '°'; $('invert').checked = invert;

const q = new URLSearchParams(location.search);
if (q.get('code')) $('code').value = q.get('code').toUpperCase();
$('code').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase(); });

function status(cls, text) { const s = $('status'); s.className = cls; s.textContent = text; }

$('go').addEventListener('click', async () => {
  const code = ($('code').value || '').trim().toUpperCase();
  if (code.length < 4) { $('err').textContent = 'Type the code from the game screen.'; return; }
  // iOS asks for motion permission, and only from a tap: this one
  try {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      const r = await DeviceMotionEvent.requestPermission();
      if (r !== 'granted') { $('err').textContent = 'Motion access was denied. Allow it and tap again.'; return; }
    }
  } catch (e) { /* not iOS */ }
  if (!window.supabase) { $('err').textContent = 'No internet connection to the game.'; return; }
  const sb = window.supabase.createClient(CFG.url, CFG.key, { realtime: { params: { eventsPerSecond: 40 } } });
  channel = sb.channel(CFG.prefix + code, { config: { broadcast: { self: false }, presence: { key: 'phone' } } });
  channel
    .on('broadcast', { event: 'host-ack' }, () => status('ok', '✓ Connected — tilt to steer'))
    .subscribe(st => {
      if (st === 'SUBSCRIBED') {
        channel.track({ role: 'phone' });
        channel.send({ type: 'broadcast', event: 'hello', payload: {} });
        status('', 'Waiting for the game… (is it open?)');
      } else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') status('err', 'Connection problem — check signal and retry');
    });
  addEventListener('devicemotion', onMotion);
  zero = null; primed = false;
  $('connect').classList.add('hidden');
  $('drive').classList.remove('hidden');
  // keep-alive: the game drops a wheel it has not heard from in 2.5 s
  setInterval(() => channel && send(true), 50);
  let tries = 0;
  const hi = setInterval(() => {
    if (!channel || tries++ > 6) return clearInterval(hi);
    channel.send({ type: 'broadcast', event: 'hello', payload: {} });
  }, 700);
});

function onMotion(e) {
  const g = e.accelerationIncludingGravity;
  if (!g) return;
  const gx = g.x || 0, gy = g.y || 0;
  // Lying flat (or a device with no real sensor, which reports all zeros),
  // gravity points through the screen and "roll" means nothing: the angle
  // below would be noise, and noise at sens 28 is a full-lock swerve. Hold
  // the last steering until the phone is upright enough to read again.
  if (Math.hypot(gx, gy) < 2.5) return;
  if (!primed) { fx = gx; fy = gy; primed = true; }
  else { fx += (gx - fx) * 0.35; fy += (gy - fy) * 0.35; }   // low-pass the jitter
  const angle = Math.atan2(fx, fy) * 180 / Math.PI;
  if (zero === null) zero = angle;
  let d = angle - zero;
  if (d > 180) d -= 360; else if (d < -180) d += 360;
  steer = clamp((invert ? -d : d) / sens, -1, 1);
  $('wheel').style.transform = `rotate(${(-steer * 90).toFixed(1)}deg)`;
  // say what the GAME is getting: turn left and this must read LEFT, or tick Invert
  $('deg').textContent = steer > 0.03 ? `LEFT ${Math.round(steer * 100)}%` : steer < -0.03 ? `RIGHT ${Math.round(-steer * 100)}%` : 'STRAIGHT';
  const pct = Math.abs(steer) * 50, f = $('fill');
  f.style.width = pct + '%'; f.style.left = steer >= 0 ? (50 - pct) + '%' : '50%';
  f.style.background = Math.abs(steer) > 0.97 ? 'var(--red)' : 'var(--mint)';
  send(false);
}

function send(force) {
  if (!channel) return;
  const now = performance.now();
  if (!force && now - lastSent < 33) return;   // ~30 Hz
  lastSent = now;
  channel.send({ type: 'broadcast', event: 'steer', payload: { v: +steer.toFixed(3) } });
}

$('centre').addEventListener('click', () => { zero = null; });
$('sens').addEventListener('input', e => { sens = +e.target.value; $('sensV').textContent = sens + '°'; store('wdc_wheel_sens', sens); });
$('invert').addEventListener('change', e => { invert = e.target.checked; store('wdc_wheel_invert', invert ? '1' : '0'); });
$('off').addEventListener('click', () => {
  try { channel && channel.unsubscribe(); } catch (e) {}
  channel = null;
  removeEventListener('devicemotion', onMotion);
  $('drive').classList.add('hidden'); $('connect').classList.remove('hidden');
});
$('fs').addEventListener('click', async () => {
  const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) { status('', 'iPhone: Share → Add to Home Screen, then open it from the icon'); return; }
  try { await req.call(el); if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch (e) {}
});
</script>
</body>
</html>
