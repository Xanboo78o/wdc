<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="icon-192.png">
<title>XBR</title>
<!--
  ad-gt.html — the third film. 72 seconds, 9:16 (a phone held upright), night,
  rain, the Nordschleife: a GT4 defends against a GT3 and loses. No words until
  the name. The picture is js/ads/gt.js on js/ads/gt-plan.js; the sound is
  js/ads/score-gt.js. Same projector as the other two (js/ads/film.js):

    ?t=20        start at 20 s          ?mute=1     picture only
    ?frame=20    draw second 20 exactly, no audio, set window.__adReady (screenshots)
    ?lo=1        no woods or town (fast)  ?scale=0.6  fixed render scale

  Checks that need no browser:  node js/ads/gt-check.mjs geo | score | audio
  Serve the repo (python3 -m http.server) and open this page. Works offline.
-->
<style>
@font-face{font-family:"Anton";src:url("data/fonts/anton.woff2") format("woff2");font-display:block}
@font-face{font-family:"Rubik";src:url("data/fonts/rubik.woff2") format("woff2");font-weight:300 900;font-display:block}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;overflow:hidden;background:#000;font-size:9px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#caps{position:absolute;inset:0;pointer-events:none}
.cap{position:absolute;left:0;right:0;text-align:center;visibility:hidden;will-change:opacity}
/* 1em = 1% of the picture's height. The name: small, on black, a little above the middle. */
.xbr{top:47.6%;font:400 2.5em/1 "Anton","Arial Narrow",Impact,sans-serif;letter-spacing:.2em;text-indent:.2em;color:#f2f0ea}
.xbr i{font-style:normal;color:#ff2d46}
#card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 45%,rgba(18,18,22,.55),rgba(0,0,0,.94));cursor:default;transition:opacity .5s}
#card.ready{cursor:pointer}
#card.gone{opacity:0;pointer-events:none}
#card .logo{font:400 7em/1 "Anton","Arial Narrow",Impact,sans-serif;letter-spacing:.04em}
#card .logo i{font-style:normal;color:#ff2d46}
#cardmsg{margin-top:1.6em;font:500 1.15em/1 "Rubik",system-ui,sans-serif;letter-spacing:.6em;text-indent:.6em;opacity:.8}
#card.ready #cardmsg{animation:pulse 1.6s ease-in-out infinite}
#card .hint{margin-top:1.4em;font:400 .85em/1 "Rubik",system-ui,sans-serif;letter-spacing:.3em;opacity:.4}
#card button{font-size:.85em !important}
#card button + div{font-size:.7em !important;max-width:30em !important;padding:0 2em}
@keyframes pulse{50%{opacity:.35}}
/* after the film: a mark to play it again, not a word */
#again{position:absolute;left:50%;top:90%;transform:translateX(-50%);width:3.2em;height:3.2em;border-radius:50%;border:.1em solid rgba(255,255,255,.4);
  background:transparent;color:#fff;font:400 1.5em/1 system-ui,sans-serif;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s 1.2s}
#again.show{opacity:.5;pointer-events:auto}
#again:hover{opacity:1;border-color:#ff2d46}
body.playing{cursor:none}
</style>
<script type="importmap">
{ "imports": { "three": "./js/vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="caps"></div>
  <button id="again" aria-label="play again">&#8635;</button>
  <div id="card"><div class="logo">XB<i>R</i></div><div id="cardmsg">LOADING</div><div class="hint">SOUND ON</div></div>
</div>
<script type="module" src="./js/ads/gt.js"></script>
</body>
</html>
