<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CWDC, by Xander</title>
<link rel="manifest" href="./manifest.webmanifest">
<!-- HOME. The place you sit in between races (Adam, 2026-10-03): a live race
     running behind it, big chunky buttons, one job per page. Circuit, garage
     (league + team) and session are separate pages on purpose. Everything is
     drawn by js/home.js; the look is all in this file. The race itself is
     still index.html and is not restyled by any of this. -->
<style>
/* THE LOOK IS ADAM'S OWN, lifted from his Scratch games (account Xanboo78o:
   Orbix Odyssey, Egg Money, Formula Scratch, Santa Skier) after he called the
   first pass "robloxy". What his buttons and cards actually are:
   - a FLAT fill with a border in a DARKER SHADE OF THE SAME COLOUR, never black
     ("Start" grey on grey, "GO!" green on green, "News" blue on blue)
   - no shadow, no tilt; a button GROWS when you are on it. His are square;
     ours are ROUNDED (Adam: "round the edges, just take the inspiration")
   - plain bold Helvetica (Scratch's Sans Serif), chequered flags by the title
   - a picture in a grey frame with a white name card under it (character select)
   - sky blue, grass green, simple saturated colours
   Every coloured thing sets --f (fill) and --b (border). */
/* The lettering: Scratch's own two fun fonts (Adam: "make the font fun").
   Marker (Knewave) for anything that shouts, Handwriting (Handlee) for the rest. */
@font-face{font-family:"Marker";src:url("data/fonts/knewave.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Hand";src:url("data/fonts/handlee.woff2") format("woff2");font-display:swap}
:root{
  --sky:#a6e3ff; --hill:#3fbf4f; --hillb:#1f8a33; --text:#151515; --soft:#6b6b6b;
  --team:#e8452c; --team2:#ffd23f;
  --font:"Hand","Comic Sans MS",Helvetica,Arial,sans-serif; --loud:"Marker","Hand",Helvetica,Arial,sans-serif;
}
html[data-theme=dark]{--sky:#22305a; --hill:#2c7a48; --hillb:#18502c}
html[data-theme=halloween]{--sky:#4a2560; --hill:#e8801c; --hillb:#9c4f08}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--text);font-family:var(--font);user-select:none}
button{font-family:inherit;color:inherit}

/* the live race: drawn small and stretched, which is most of why it is cheap */
#live{position:fixed;left:0;top:0;width:62.5%;height:62.5%;transform:scale(1.6);transform-origin:0 0;border:0;opacity:0;transition:opacity 1s;pointer-events:none}
#live.up{opacity:1}
#wash{position:fixed;inset:0;background:var(--sky);opacity:0;transition:opacity .2s;pointer-events:none;overflow:hidden}
#wash::after{content:'';position:absolute;left:-12%;right:-12%;bottom:-34%;height:52%;border-radius:50%;background:var(--hill);border:7px solid var(--hillb)}
body:not([data-page=home]) #wash{opacity:1}
#page{position:fixed;inset:0;display:flex;flex-direction:column;padding:18px 22px 20px;gap:14px}

/* the one shape: flat, bordered in its own darker shade */
.chunk{--f:#ffffff;--b:#8c8c8c;position:relative;border-radius:16px;border:5px solid var(--b);background:var(--f);color:var(--text);transition:transform .08s}
button.chunk{cursor:pointer;font-family:var(--loud);font-weight:normal;letter-spacing:.02em}
.logo,.title,.chip,.me b,.next b,.card b,.pill,.no,.num,.stamp,.trow b{font-family:var(--loud);font-weight:normal !important}
.chip small,.race small,.tabs small{font-family:var(--font)}
.say.shout{--f:#f5d94a;--b:#b8960f;font-family:var(--loud);font-size:18px;animation:shout .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes shout{from{transform:scale(.5) rotate(-4deg)}to{transform:none}}
.chunk.on{transform:scale(1.07);box-shadow:0 0 0 5px #fff;z-index:2}
button.chunk:active{transform:scale(.96)}
.grey{--f:#d6d6d6;--b:#8a8a8a}
.go{--f:#6fe38b;--b:#3f9a58}
.hot{--f:#ffa53a;--b:#c56f0c}
.sun{--f:#f5d94a;--b:#b8960f}
.cool{--f:#66b8ff;--b:#1b6fb5}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex:none}
.logo{display:flex;align-items:center;gap:8px;padding:6px 14px;font-weight:bold;font-size:24px;line-height:.95;text-align:center}
.logo svg{width:38px;height:38px}
.logo small{display:block;font-size:10px;font-weight:normal;color:var(--soft);margin-top:3px}
.chip{padding:6px 12px;font-weight:bold;font-size:15px}
.chip small{display:block;font-size:10px;font-weight:normal}
.grow{flex:1}
.title{font-weight:bold;font-size:34px;color:#0a6fb0;text-decoration:underline;text-underline-offset:5px}
html:not([data-theme=light]) .title{color:#fff}
.say{align-self:flex-start;max-width:520px;padding:8px 14px;font-size:17px}
.say.in{animation:sayIn .2s ease-out both}
@keyframes sayIn{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px;margin-right:7px}
.eq i{width:3px;height:11px;background:currentColor;transform-origin:bottom;animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-duration:.55s}.eq i:nth-child(3){animation-duration:.7s}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}

/* HOME */
.mid{flex:1;min-height:0;display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.me{width:240px;padding:12px 14px;cursor:pointer}
.me .no{width:54px;height:54px;border-radius:50%;border:5px solid #8c8c8c;display:flex;align-items:center;justify-content:center;
  font-weight:bold;font-size:22px;float:right;background:#fff}
.me small,.next small,.tower small{display:block;font-size:13px;color:var(--soft)}
.me b{display:block;font-size:24px;font-weight:normal;line-height:1.05;margin:2px 0 8px}
.stripe{height:16px;border-radius:8px;border:4px solid #8c8c8c;background:linear-gradient(90deg,var(--team) 0 66%,var(--team2) 66%)}
.me i{display:block;margin-top:7px;font-style:normal;font-size:12px;color:var(--soft)}
.tower{width:230px;padding:10px 0 8px;font-size:14px}
.tower small{padding:0 12px 6px}
.tower small u{text-decoration:none;color:#e02b20}
.trow{display:flex;align-items:center;gap:8px;padding:2px 12px}
.trow b{width:16px;text-align:right}
.trow i{width:8px;height:13px;border-radius:3px;flex:none}
.trow span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow em{font-style:normal;color:var(--soft);font-size:11px;font-variant-numeric:tabular-nums}
.dock{flex:none;display:flex;align-items:flex-end;gap:14px}
.next{width:240px;padding:10px 12px;cursor:pointer}
.next .frame{height:96px;margin:5px 0}
.next b{display:block;font-size:20px;font-weight:normal;line-height:1.05}
.tiles{flex:1;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tile{width:98px;height:92px;padding:6px;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tile svg{width:44px;height:44px}
.race{border-radius:22px;width:230px;height:112px;font-size:40px;display:flex;align-items:center;justify-content:center;gap:10px}
.race svg{width:46px;height:46px}
.race small{display:block;font-size:12px;font-weight:normal;white-space:nowrap}

/* pages after home */
.foot{flex:none;display:flex;justify-content:space-between;align-items:center}
.foot .chunk{padding:12px 30px;font-size:24px}
.foot .hint{font-size:11px;color:#fff;font-weight:bold}
.body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:18px}
.arrow{width:70px;height:70px;font-size:34px;border-radius:50%;flex:none}

/* a picture in a grey frame, a white name card under it */
.frame{border-radius:12px;border:5px solid #8c8c8c;background:#c9c9c9;position:relative;overflow:hidden;display:flex}
.frame svg{flex:1;min-width:0;min-height:0;width:100%;height:100%;padding:8px;overflow:visible}
.cards{flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:center;gap:22px}
.card{padding:12px 14px 14px;display:flex;flex-direction:column;border-color:#8c8c8c}
.card .frame{flex:1;min-height:0;margin-bottom:8px}
.card.side{width:200px;height:240px;opacity:.9;cursor:pointer;transform:scale(.94)}
.card.main{width:min(520px,46vw);height:min(440px,62vh)}
.card.main.in{animation:cardIn .18s ease-out both}
@keyframes cardIn{from{transform:scale(.92)}to{transform:none}}
.card .no{position:absolute;left:-18px;top:-18px;z-index:3;width:54px;height:54px;border-radius:50%;border:5px solid #b8960f;background:#f5d94a;
  display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:21px}
.card small{font-size:14px;color:var(--soft)}
.card b{font-size:clamp(22px,3vw,36px);font-weight:normal;line-height:1.05}
.card.side b{font-size:19px}
.card i{font-style:normal;font-size:15px;color:#222;margin-top:4px}
svg .casing{fill:none;stroke:#4a4a4a;stroke-width:9px;stroke-linejoin:round;stroke-linecap:round}
svg .tarmac{fill:none;stroke:#8d8d8d;stroke-width:4px;stroke-linejoin:round;stroke-linecap:round}
svg .car{fill:#ff3b30;stroke:#a3140c}
.tabs{display:flex;gap:10px;justify-content:center;align-self:center;flex:none;padding:6px}
.tabs .chunk{padding:8px 24px;font-size:20px}
.tabs .chunk.sel{--f:#f5d94a;--b:#b8960f}
.tabs{border-radius:20px}
.tabs.on{box-shadow:0 0 0 5px #fff}
.tabs .chunk small{display:block;font-size:10px;font-weight:normal}
.livery{flex:1;min-height:0;margin-bottom:8px;border-radius:12px;border:5px solid #8c8c8c;position:relative;overflow:hidden}
.livery::after{content:'';position:absolute;left:-10%;right:-10%;top:54%;height:20%;background:var(--c2);transform:rotate(-6deg)}
.livery .num{position:absolute;right:14px;top:12px;z-index:1;width:60px;height:60px;border-radius:50%;background:#fff;border:5px solid #8c8c8c;
  display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:25px}
.stamp{position:absolute;z-index:1;right:12px;bottom:12px;padding:4px 10px;border-radius:10px;border:4px solid #3f9a58;background:#6fe38b;font-weight:bold;font-size:13px}

/* session + settings: a card per setting, its values as buttons */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;align-content:safe center;overflow:auto;padding:10px 8px 12px}
.opt{padding:7px 12px 9px}
.opt.on{transform:scale(1.03)}
.opt small{display:block;font-size:13px;color:var(--soft);margin-bottom:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:4px 11px;border-radius:12px;border:4px solid #8a8a8a;background:#d6d6d6;font-weight:bold;font-size:13px;cursor:pointer}
.pill.sel{background:#6fe38b;border-color:#3f9a58}

@media (max-width:820px){
  .me,.tower,.next{display:none}
  .card.side{display:none}
  .race{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>

</head>
<body data-page="home">
<iframe id="live" tabindex="-1" aria-hidden="true"></iframe>
<div id="wash"></div>
<div id="page"></div>
<script type="module" src="./js/home.js"></script>
</body>
</html>
