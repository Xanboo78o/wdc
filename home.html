<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CWDC, by Xander</title>
<link rel="manifest" href="./manifest.webmanifest">
<!-- HOME. The place you sit in between races (Adam, 2026-10-03): a live race
     running behind it, big chunky buttons, one job per page. Circuit, garage
     (league + team) and session are separate pages on purpose. Everything is
     drawn by js/home.js; the look is all in this file. The race itself is
     still index.html and is not restyled by any of this. -->
<style>
@font-face{font-family:"Rubik";src:url("data/fonts/rubik.woff2") format("woff2");font-weight:300 900;font-display:swap}
:root{
  --paper:#f7efdc; --card:#fffaf0; --ink:#2a241c; --text:#2a241c; --soft:#8b7f6c;
  --go:#58c043; --hot:#ff8a2a; --sun:#ffd23f; --cool:#49b6e8; --red:#e8452c;
  --wash:rgba(247,239,220,.93);
  --team:#e8452c; --team2:#ffd23f;
  --font:"Rubik",ui-rounded,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html[data-theme=dark]{--paper:#2c2542; --card:#3d3460; --ink:#110d1c; --text:#fff3dc; --soft:#b3a6cf; --wash:rgba(44,37,66,.93)}
html[data-theme=halloween]{--paper:#2a1830; --card:#40234a; --ink:#0e0712; --text:#ffe9cf; --soft:#c79bd1;
  --go:#9be24f; --hot:#ff7a1a; --sun:#ffb21a; --cool:#b06cff; --wash:rgba(42,24,48,.93)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--text);font-family:var(--font);
  -webkit-font-smoothing:antialiased;user-select:none}
button{font-family:inherit;color:inherit}

/* the live race */
#live{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity 1.2s;pointer-events:none}
#live.up{opacity:1}
#wash{position:fixed;inset:0;background:var(--wash);opacity:0;transition:opacity .25s;pointer-events:none}
body:not([data-page=home]) #wash{opacity:1}
#page{position:fixed;inset:0;display:flex;flex-direction:column;padding:18px 22px 20px;gap:14px}

/* the chunky thing everything is made of */
.chunk{position:relative;border:3px solid var(--ink);border-radius:18px;background:var(--card);color:var(--text);
  box-shadow:0 6px 0 var(--ink);transition:transform .09s,box-shadow .09s}
button.chunk{cursor:pointer;font-weight:900;letter-spacing:.04em}
.chunk.on{transform:translateY(-4px) rotate(-.7deg);box-shadow:0 10px 0 var(--ink),0 0 0 5px var(--sun)}
button.chunk:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.go{background:var(--go);color:#12240d}
.hot{background:var(--hot);color:#2b1403}
.sun{background:var(--sun);color:#2b2103}
.cool{background:var(--cool);color:#06222f}
.outline{text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 5px 0 var(--ink);color:#fff}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex:none}
.logo{font-weight:900;font-size:30px;letter-spacing:.02em;line-height:1;transform:rotate(-2deg)}
.logo span{color:var(--sun)}
.chip{padding:8px 14px;border-radius:14px;font-weight:800;font-size:13px;letter-spacing:.06em;box-shadow:0 4px 0 var(--ink)}
.chip small{display:block;font-size:9px;letter-spacing:.14em;opacity:.7;font-weight:700}
.grow{flex:1}
.title{font-weight:900;font-size:34px;letter-spacing:.01em}
.say{align-self:flex-start;max-width:520px;padding:9px 16px;border-radius:16px 16px 16px 4px;font-weight:600;font-size:15px;box-shadow:0 4px 0 var(--ink)}
.say.in{animation:sayIn .3s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes sayIn{from{transform:scale(.8) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px;margin-right:7px}
.eq i{width:3px;height:11px;background:currentColor;transform-origin:bottom;animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-duration:.55s}.eq i:nth-child(3){animation-duration:.7s}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}

/* HOME */
.mid{flex:1;min-height:0;display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.me{width:250px;padding:14px 16px;cursor:pointer}
.me .no{width:58px;height:58px;border-radius:50%;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:24px;float:right;background:#fff;color:#1d1b18}
.me small,.next small,.tower small{display:block;font-size:10px;letter-spacing:.18em;font-weight:800;color:var(--soft)}
.me b{display:block;font-size:22px;font-weight:900;line-height:1.05;margin:3px 0 8px}
.stripe{height:14px;border-radius:7px;border:2px solid var(--ink);background:linear-gradient(90deg,var(--team) 0 62%,var(--team2) 62% 86%,var(--ink) 86%)}
.me i{display:block;margin-top:8px;font-style:normal;font-size:12px;font-weight:600;color:var(--soft)}
.tower{width:230px;padding:12px 0 8px;font-size:12px}
.tower small{padding:0 14px 6px}
.tower small u{text-decoration:none;color:var(--red)}
.trow{display:flex;align-items:center;gap:8px;padding:2px 14px;font-weight:700}
.trow b{width:16px;text-align:right;font-weight:900}
.trow i{width:6px;height:13px;border-radius:2px;flex:none}
.trow span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow em{font-style:normal;color:var(--soft);font-size:11px;font-variant-numeric:tabular-nums}
.dock{flex:none;display:flex;align-items:flex-end;gap:14px}
.next{width:250px;padding:12px 14px;cursor:pointer}
.next svg{display:block;width:100%;height:92px;margin:6px 0 4px;overflow:visible}
.next b{display:block;font-size:19px;font-weight:900;line-height:1.05}
.tiles{flex:1;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tile{width:100px;height:88px;padding:8px;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.tile em{font-style:normal;font-size:28px;line-height:1}
.race{width:230px;height:118px;font-size:38px;border-radius:24px;letter-spacing:.03em}
.race small{display:block;font-size:11px;letter-spacing:.16em;font-weight:800;opacity:.75}

/* pages after home */
.foot{flex:none;display:flex;justify-content:space-between;align-items:center}
.foot .chunk{padding:14px 34px;font-size:22px}
.foot .hint{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--soft)}
.body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:18px}
.arrow{width:74px;height:74px;font-size:34px;border-radius:50%;flex:none}

/* circuit + team carousels */
.cards{flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:center;gap:22px}
.card{padding:18px 22px;display:flex;flex-direction:column}
.card.side{width:210px;height:250px;opacity:.6;cursor:pointer;transform:scale(.94)}
.card.side.l{transform:scale(.94) rotate(-2deg)}.card.side.r{transform:scale(.94) rotate(2deg)}
.card.main{width:min(520px,46vw);height:min(440px,62vh)}
.card.main.in{animation:cardIn .22s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes cardIn{from{transform:scale(.92) rotate(1.5deg)}to{transform:none}}
.card svg{flex:1;min-height:0;width:100%;overflow:visible;margin:8px 0}
.card .no{position:absolute;left:-16px;top:-16px;width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);color:#2b2103;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;box-shadow:0 4px 0 var(--ink);transform:rotate(-6deg)}
.card.main > small{margin-left:38px}
.card small{font-size:11px;letter-spacing:.2em;font-weight:800;color:var(--soft)}
.card b{font-size:clamp(22px,3vw,38px);font-weight:900;line-height:1;text-transform:uppercase}
.card.side b{font-size:19px}
.card i{font-style:normal;font-size:12px;font-weight:600;color:var(--soft);margin-top:6px}
svg .casing{fill:none;stroke:var(--ink);stroke-width:9px;stroke-linejoin:round;stroke-linecap:round}
svg .tarmac{fill:none;stroke:var(--card);stroke-width:4px;stroke-linejoin:round;stroke-linecap:round}
svg .car{fill:var(--red);stroke:var(--ink)}
.tabs{display:flex;gap:10px;justify-content:center;flex:none}
.tabs .chunk{padding:10px 26px;font-size:18px;border-radius:14px}
.tabs .chunk.sel{background:var(--sun);color:#2b2103}
.tabs.on .sel{box-shadow:0 6px 0 var(--ink),0 0 0 5px var(--cool)}
.tabs .chunk small{display:block;font-size:9px;letter-spacing:.12em;font-weight:800;opacity:.75}
.livery{flex:1;min-height:0;margin:10px 0;border:3px solid var(--ink);border-radius:14px;position:relative;overflow:hidden}
.livery::after{content:'';position:absolute;left:-10%;right:-10%;top:52%;height:22%;background:var(--c2);transform:rotate(-7deg);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.livery .num{position:absolute;right:16px;top:12px;z-index:1;width:64px;height:64px;border-radius:50%;background:#fff;color:#1d1b18;border:3px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px}
.stamp{position:absolute;right:14px;bottom:14px;padding:5px 12px;border:3px solid var(--ink);border-radius:10px;background:var(--go);color:#12240d;font-weight:900;font-size:13px;transform:rotate(-5deg)}

/* session + settings: a grid of chunky choices */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-content:center;overflow:auto;padding:8px 6px 12px}
.opt{padding:12px 14px}
.opt small{display:block;font-size:10px;letter-spacing:.2em;font-weight:800;color:var(--soft);margin-bottom:8px}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{padding:7px 12px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);font-weight:800;font-size:13px;cursor:pointer;color:var(--text)}
.pill.sel{background:var(--sun);color:#2b2103;box-shadow:0 3px 0 var(--ink);transform:translateY(-2px)}

@media (max-width:820px){
  .me,.tower,.next{display:none}
  .card.side{display:none}
  .race{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body data-page="home">
<iframe id="live" tabindex="-1" aria-hidden="true"></iframe>
<div id="wash"></div>
<div id="page"></div>
<script type="module" src="./js/home.js"></script>
</body>
</html>
