<script type="module">
const SR = 44100, LEN = 15;
const off = new OfflineAudioContext(2, SR * LEN, SR);
window.AudioContext = function () { return off; };
const { Engine, FX } = await import('/js/audio.js');
if (location.hash === '#fx') Object.assign(FX, { engBoost: 0, grit: 0, synth: 0 });
if (location.hash === '#old') Object.assign(FX, { engBoost: 1, grit: 0, tyreMin: 0, gravel: 0, grass: 0, kerb: 0, stones: 0, crash: 0, scrape: 0, concuss: 0 });
const e = new Engine({ pick: 1, cls: 'f1', synth: location.hash !== '#loop' });
localStorage.clear();
await e.start('/');
// scenario: [t0, t1, what]
const seg = [[0, 2, 'tarmac 250kmh full throttle', { surf: 1 }], [2, 4, 'gravel 150kmh', { surf: 0.58 }],
  [4, 6, 'grass 120kmh', { surf: 0.42 }], [6, 7.5, 'kerb 180kmh', { surf: 0.93 }],
  [7.5, 9, 'wall scrape 120kmh', { surf: 1, wall: true }], [9, 12, 'BIG CRASH 25m/s at 9.0s', { surf: 1 }], [12, 13, 'gravel again 150kmh', { surf: 0.58 }],
  [13, 15, 'PAUSED at 13s (no update) — must go silent', { surf: 0.58, paused: true }]];
const kmh = { 0: 250, 2: 150, 4: 120, 6: 180, 7.5: 120, 9: 60, 12: 150, 13: 150 };
let hitDone = false;
for (let t = 0.02; t < LEN; t += 1 / 60) {
  off.suspend(t).then(async () => {
    const s = seg.find(q => t >= q[0] && t < q[1]);
    // Paused: nobody calls update(). Give the page's watchdog real time to
    // notice, exactly as it would in the pause menu.
    if (s[3].paused) { await new Promise(r => setTimeout(r, 40)); off.resume(); return; }
    const v = (kmh[s[0]] || 100) / 3.6;
    e.update(11500, t < 9 ? 1 : 0.2, { speed: v, slip: 0, peak: 0.12, off: s[3].surf < 0.9 ? 1 : 0, ...s[3], dt: 1 / 60 });
    if (t >= 9 && !hitDone) { hitDone = true; e.hit(25); }
    off.resume();
  });
}
const buf = await off.startRendering();
const L = buf.getChannelData(0);
const out = [];
for (const [a, b, name] of seg) {
  let sq = 0, pk = 0; const i0 = Math.floor(a * SR), i1 = Math.floor(b * SR);
  for (let i = i0; i < i1; i++) { sq += L[i] * L[i]; pk = Math.max(pk, Math.abs(L[i])); }
  out.push(`${name.padEnd(28)} rms ${(20 * Math.log10(Math.sqrt(sq / (i1 - i0)))).toFixed(1)} dBFS  peak ${(20 * Math.log10(pk)).toFixed(1)}`);
}
// the concussion: brightness (high band energy) after the hit vs before
const hf = (a, b) => { let s = 0, n = 0; for (let i = Math.floor(a * SR) + 1; i < b * SR; i++) { const d = L[i] - L[i - 1]; s += d * d; n++; } return 10 * Math.log10(s / n); };
// From 1 s after the pause: this offline clock runs ~2.4x slower than the
// wall clock the page's watchdog uses, so its 0.2 s lands later here.
{ let sq = 0; const i0 = Math.floor(14 * SR), i1 = 15 * SR; for (let i = i0; i < i1; i++) sq += L[i] * L[i];
  out.push(`paused, 1 s on: rms ${(20 * Math.log10(Math.sqrt(sq / (i1 - i0)) + 1e-12)).toFixed(1)} dBFS  (${Math.sqrt(sq / (i1 - i0)) < 0.0056 ? 'SILENT (< -45 dB) - ok' : 'STILL PLAYING - FAIL'})`); }
{ // what is still sounding while paused: level over time and its loudest pitch
  const seg = (a, b) => { let q = 0; for (let i = Math.floor(a * SR); i < b * SR; i++) q += L[i] * L[i]; return (10 * Math.log10(q / ((b - a) * SR) + 1e-12)).toFixed(1); };
  let zc = 0; for (let i = Math.floor(14 * SR) + 1; i < 15 * SR; i++) if ((L[i] > 0) !== (L[i - 1] > 0)) zc++;
  out.push(`paused tail: 13.0-13.5 ${seg(13, 13.5)}  13.5-14 ${seg(13.5, 14)}  14-14.5 ${seg(14, 14.5)}  14.5-15 ${seg(14.5, 15)} dB; zero-crossings/s in the last second ${zc / 2}`); }
out.push(`high-freq energy: before hit ${hf(8.5, 9).toFixed(1)}  0.5-1s after ${hf(9.5, 10).toFixed(1)}  2.5-3s after ${hf(11.5, 12).toFixed(1)} dB`);
out.push(`clipped samples (>=1.0): ${L.reduce((n, x) => n + (Math.abs(x) >= 0.999), 0)}`);
out.push(`loaded: gravel ${!!e.gravel} grass ${!!e.grass} scrape ${!!e.scrape} bufs ${Object.keys(e.bufs || {}).length}`);
// SPECTRUM of the tarmac segment (11,500 rpm, full throttle): where the
// energy is. An F1 V6 fires 3x per rev, so 11,500 rpm should peak at 575 Hz.
{
  const n = 16384, i0 = Math.floor(0.5 * SR), re = new Float64Array(n), im = new Float64Array(n);
  for (let i = 0; i < n; i++) re[i] = L[i0 + i] * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / n));
  for (let i = 1, j = 0; i < n; i++) { let b = n >> 1; for (; j & b; b >>= 1) j ^= b; j ^= b; if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; } }
  for (let len = 2; len <= n; len <<= 1) { const a = -2 * Math.PI / len; for (let i = 0; i < n; i += len) for (let k = 0; k < len / 2; k++) {
    const c = Math.cos(a * k), sn = Math.sin(a * k), u = i + k, v = i + k + len / 2;
    const tr = re[v] * c - im[v] * sn, ti = re[v] * sn + im[v] * c; re[v] = re[u] - tr; im[v] = im[u] - ti; re[u] += tr; im[u] += ti; } }
  let pk = 0, pf = 0, sw = 0, sf = 0, lowE = 0, allE = 0;
  for (let k = 1; k < n / 2; k++) { const f = k * SR / n, m = Math.hypot(re[k], im[k]);
    if (f > 60 && m > pk) { pk = m; pf = f; } sw += m; sf += m * f; allE += m * m; if (f < 250) lowE += m * m; }
  out.push(`engine spectrum @ 11500 rpm: loudest ${pf.toFixed(0)} Hz, centroid ${(sf / sw).toFixed(0)} Hz, energy below 250 Hz ${(100 * lowE / allE).toFixed(1)}%`);
}
// ENGINE vs CRASH: the crash transient over the engine it lands on
{ let pe = 0, pc = 0; for (let i = Math.floor(8.5 * SR); i < 9 * SR; i++) pe = Math.max(pe, Math.abs(L[i]));
  for (let i = 9 * SR; i < Math.floor(9.6 * SR); i++) pc = Math.max(pc, Math.abs(L[i]));
  out.push(`engine peak just before the crash ${(20 * Math.log10(pe)).toFixed(1)} dBFS, crash peak ${(20 * Math.log10(pc)).toFixed(1)} dBFS`); }
document.body.innerText = out.join('\n'); document.title = 'done';
</script>
