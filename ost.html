<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CWDC OST</title>
<style>
  :root { --bg: #101114; --panel: #191b20; --line: #2a2d35; --dim: #8d93a1; --fg: #f1efe9; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; min-height: 100vh; }
  header { padding: 26px 28px 6px; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: 3px; font-weight: 900; font-style: italic; }
  header p { margin: 4px 0 0; color: var(--dim); font-size: 13px; }
  main { padding: 10px 28px 140px; max-width: 1000px; }
  .circuit { border-left: 6px solid var(--c); padding: 4px 0 4px 16px; margin: 22px 0; }
  .circuit h2 { margin: 0; font-size: 20px; letter-spacing: 3px; color: var(--c); }
  .circuit > small { color: var(--dim); letter-spacing: 1px; }
  .songs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-top: 12px; }
  .song { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 14px; }
  .song.on { border-color: var(--c); box-shadow: 0 0 0 1px var(--c); }
  .mood { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--c); color: #fff; }
  .mood.less { background: transparent; color: var(--dim); border: 1px solid var(--line); }
  .song h3 { margin: 8px 0 2px; font-size: 17px; letter-spacing: 1px; }
  .song p { margin: 0 0 10px; color: var(--dim); font-size: 12px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button { background: var(--fg); color: #000; border: 0; border-radius: 999px; padding: 7px 15px; font-weight: 800; letter-spacing: 1px; font-size: 12px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  button:disabled { opacity: .4; cursor: default; }
  .soon { color: var(--dim); font-size: 13px; margin-top: 8px; }
  #deck { position: fixed; left: 0; right: 0; bottom: 0; border-top: 1px solid var(--line); background: rgba(16,17,20,0.94); backdrop-filter: blur(8px); padding: 10px 28px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
  #np b { letter-spacing: 1px; }
  #np small { color: var(--dim); margin-left: 8px; }
  #sec { font-family: ui-monospace, monospace; font-size: 12px; color: var(--dim); margin-left: 10px; }
  canvas#viz { width: 100%; height: 54px; display: block; margin-top: 6px; border-radius: 6px; background: #0a0b0d; }
  .knobs { display: flex; gap: 12px; align-items: center; font-size: 11px; color: var(--dim); letter-spacing: 1px; }
  .knobs label { display: flex; gap: 6px; align-items: center; }
  input[type=range] { width: 110px; }
  #report { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 11.5px; background: #0a0b0d; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 16px; display: none; }
</style>
</head>
<body>
<header><h1>CWDC · ORIGINAL SOUNDTRACK</h1><p>Two songs per circuit, one fun and one less fun. Everything here is synthesised live in your browser.</p></header>
<main><div id="list"></div><div id="report"></div></main>
<div id="deck">
  <div><div id="np"><b id="npTitle">NOTHING PLAYING</b><small id="npSub">press play on a song</small><span id="sec"></span></div><canvas id="viz" width="900" height="54"></canvas></div>
  <div class="knobs">
    <label>VOLUME <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8"></label>
    <button class="ghost" id="stopBtn">STOP</button>
  </div>
</div>
<script type="module">
import { Music } from './js/music.js';
import { SONGS, STATIONS } from './js/ost.js';

const q = new URLSearchParams(location.search);
const music = new Music(SONGS, STATIONS);
window.MUSIC = music;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const songLen = s => s.sections.reduce((a, b) => a + b.bars, 0) * 4 * 60 / s.bpm;

function render() {
  const list = document.getElementById('list'); list.innerHTML = '';
  for (const st of STATIONS) {
    const c = document.createElement('section'); c.className = 'circuit'; c.style.setProperty('--c', st.color);
    c.innerHTML = `<h2>${st.name}</h2><small>${st.tag}</small>`;
    const grid = document.createElement('div'); grid.className = 'songs';
    for (const id of st.songs) {
      const s = SONGS[id], el = document.createElement('div'); el.className = 'song' + (music.playing === id ? ' on' : '');
      el.innerHTML = `<span class="mood ${s.mood === 'fun' ? '' : 'less'}">${s.mood}</span><h3>${s.name}</h3><p>${s.bpm} bpm · ${s.key} · ${fmt(songLen(s))} · ${s.sections.map(x => x.name).join(' › ')}</p>`;
      const row = document.createElement('div'); row.className = 'row';
      const play = document.createElement('button'); play.textContent = music.playing === id ? 'RESTART' : 'PLAY'; play.onclick = () => { music.play(id); render(); };
      const wav = document.createElement('button'); wav.className = 'ghost'; wav.textContent = 'DOWNLOAD WAV'; wav.onclick = () => exportWav(id, wav);
      row.append(play, wav); el.appendChild(row); grid.appendChild(el);
    }
    if (!st.songs.length) grid.innerHTML = '<div class="soon">Two songs coming.</div>';
    c.appendChild(grid); list.appendChild(c);
  }
}
music.onTrack = (song, st) => {
  document.getElementById('npTitle').textContent = song.name;
  document.getElementById('npSub').textContent = `${st.name} · ${song.mood} · ${song.bpm} bpm`;
  render();
};
document.getElementById('vol').oninput = e => music.setVolume(+e.target.value);
document.getElementById('stopBtn').onclick = () => { music.stop(); document.getElementById('npTitle').textContent = 'STOPPED'; document.getElementById('sec').textContent = ''; render(); };

const viz = document.getElementById('viz'), vctx = viz.getContext('2d');
function frame() {
  requestAnimationFrame(frame);
  if (!music.ctx) return;
  const an = music.analyser, W = viz.width, H = viz.height, fd = new Uint8Array(an.frequencyBinCount); an.getByteFrequencyData(fd);
  vctx.clearRect(0, 0, W, H);
  const st = STATIONS.find(s => s.id === (music.song ? music.song.station : STATIONS[0].id));
  vctx.fillStyle = st.color;
  const bars = 90; for (let i = 0; i < bars; i++) { const v = fd[Math.floor(Math.pow(i / bars, 2) * fd.length * 0.6)] / 255; vctx.fillRect(i * (W / bars), H - v * H, W / bars - 2, v * H); }
  if (music.song) {
    const sec = music.sectionAt(music.pos) || music.lay.secs[music.lay.secs.length - 1];
    document.getElementById('sec').textContent = `${sec.name} ${Math.floor((music.pos - sec.start) / 16) + 1}/${sec.bars} · ${fmt(music.pos * music.stepDur)}`;
  }
}
requestAnimationFrame(frame);

async function exportWav(id, btn) {
  btn.disabled = true; btn.textContent = 'RENDERING…';
  try { const { buf } = await Music.render(SONGS, STATIONS, id); const a = document.createElement('a'); a.href = URL.createObjectURL(Music.wav(buf)); a.download = `${SONGS[id].name.replace(/\s+/g, '_')}.wav`; a.click(); }
  finally { btn.disabled = false; btn.textContent = 'DOWNLOAD WAV'; }
}
render();

// headless: ?check=<id> renders + analyses; the numbers land on window.__CHECK and
// a mono 22 kHz WAV (base64) on window.__WAV, for tools/ostcheck.mjs.
if (q.has('check')) {
  (async () => {
    try {
      const id = q.get('check'), t0 = performance.now();
      const { buf, lay, song } = await Music.render(SONGS, STATIONS, id);
      const rep = Music.analyze(buf, lay, song); rep.renderMs = Math.round(performance.now() - t0); rep.id = id; rep.bpm = song.bpm;
      const sr = 22050, n = Math.floor(buf.length * sr / buf.sampleRate), off = new OfflineAudioContext(1, n, sr), s = off.createBufferSource(); s.buffer = buf; s.connect(off.destination); s.start();
      const bytes = new Uint8Array(await Music.wav(await off.startRendering()).arrayBuffer());
      let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      window.__WAV = btoa(bin);
      window.__CHECK = rep;
    } catch (e) { window.__CHECK = { error: String(e && e.stack || e) }; }
  })();
}
</script>
</body>
</html>
